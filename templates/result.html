<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Pokedex Results</title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='style.css'
        ) }}">

</head>

<body>

<div class="container">

    <h1>

        {{ pokemon_name }}

    </h1>

    <img
        src="{{ image_path }}"
        class="result-image">

    <p class="confidence">

        Confidence:
        {{ confidence }}%

    </p>

    <div class="predictions">

        <h3>

            Top 5 Predictions

        </h3>

        {% for pokemon, score in predictions %}

            <p>

                {{ pokemon }}
                -
                {{ score }}%

            </p>

        {% endfor %}

    </div>

    <a
        href="/"
        class="back-button">

        <button>

            Back

        </button>

    </a>

</div>

</body>
</html>
