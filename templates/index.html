<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Pokedex AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for(
            'static',
            filename='style.css'
        ) }}">

</head>

<body>

<div class="container">

    <h1>ML Pokedex</h1>

    <div class="capture-box">

        <div class="blink">

            ----------------------------------------
            <br>

            EfficientNet-B3 Loaded Successfully

            <br>

            ----------------------------------------

            <br>

            Add image on Capture Pokemon...

            <br><br>

            ...and hit Scan pokedex

            <br><br>

            Validation Accuracy: ~95%

        </div>

    </div>

   <form
        action="/predict"
        method="POST"
        enctype="multipart/form-data">

        <label
            for="image-upload"
            class="custom-upload">

            Capture Pokemon

        </label>

        <input
            id="image-upload"
            type="file"
            name="image"
            accept="image/*"
            required
            hidden>

        <button type="submit"
        class="scan-button">

            Scan Pokedex

        </button>

    </form>

</div>

</body>
</html>
